*{margin:0;box-sizing:border-box;font-family:-apple-system,sans-serif}
html,body{background:#111;height:100%}
body{display:flex;justify-content:center;align-items:center;min-height:100vh}
.phone{width:430px;height:932px;background:#000;border-radius:60px;padding:12px;box-shadow:0 0 0 2px #333,0 30px 60px rgba(0,0,0,.6)}
.screen{width:100%;height:100%;border-radius:48px;overflow:hidden;position:relative;
  background:linear-gradient(160deg,#ff9a56,#ff6a88,#845ec2)}
@media (max-width:600px){
  body{min-height:100dvh}
  .phone{width:100vw;height:100dvh;border-radius:0;padding:0;box-shadow:none}
  .screen{border-radius:0}
}
.island{position:absolute;top:14px;left:50%;transform:translateX(-50%);width:120px;height:34px;background:#000;border-radius:20px;z-index:10}
.status{position:absolute;top:16px;left:32px;right:32px;display:flex;justify-content:space-between;color:#fff;font-size:15px;font-weight:600}
.grid{position:absolute;top:90px;left:0;right:0;padding:0 22px;display:grid;grid-template-columns:repeat(4,1fr);gap:22px 14px}
.app{display:flex;flex-direction:column;align-items:center;gap:6px}
.icon{width:58px;height:58px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:26px;box-shadow:0 3px 6px rgba(0,0,0,.25)}
.app span{color:#fff;font-size:11px;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.dock{position:absolute;bottom:20px;left:14px;right:14px;height:90px;background:rgba(255,255,255,.18);backdrop-filter:blur(20px);border-radius:32px;display:flex;justify-content:space-around;align-items:center}
.home{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:140px;height:5px;background:#fff;border-radius:3px;opacity:.9;cursor:pointer;z-index:20}
.appview{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:#fff;z-index:15;transition:transform .25s}
.appview.hidden{transform:translateY(100%)}
.appview .big{font-size:70px}
.appview h2{font-weight:600;font-size:20px}
.appview p{font-size:13px;opacity:.7}
.lock{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;color:#fff;overflow:hidden;transition:transform .5s ease,opacity .5s ease}
.lock.unlocked{transform:translateY(-100%);opacity:0;pointer-events:none}
.lockbg{position:absolute;inset:-20px;width:calc(100% + 40px);height:calc(100% + 40px);object-fit:cover;filter:blur(12px) brightness(.75);z-index:-1}
.locktime{font-size:76px;font-weight:600;margin-top:80px;text-shadow:0 2px 12px rgba(0,0,0,.3)}
.lockdate{font-size:16px;margin-top:2px;opacity:.9}
.dots{display:flex;gap:14px;margin-top:46px}
.dots span{width:12px;height:12px;border-radius:50%;border:1.5px solid #fff;background:transparent;transition:background .15s}
.dots span.filled{background:#fff}
.lockhint{font-size:13px;opacity:.75;margin-top:14px}
.keypad{margin-top:24px;display:grid;grid-template-columns:repeat(3,70px);gap:16px}
.key{width:70px;height:70px;border-radius:50%;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;font-size:27px}
.key.empty{background:transparent;font-size:12px;opacity:.8}
</style></head>

const dotEls=[...document.querySelectorAll("#dots span")];
let entered=[];
function keyHTML(k){
  if(k==="emg")return `<div class="key empty" onclick="keyTap('emg')">紧急<br>呼叫</div>`;
  if(k==="del")return `<div class="key empty" onclick="keyTap('del')">⌫</div>`;
  return `<div class="key" onclick="keyTap('${k}')">${k}</div>`;
}
document.getElementById("keypad").innerHTML=["1","2","3","4","5","6","7","8","9","emg","0","del"].map(keyHTML).join("");
function keyTap(k){
  if(k==="emg")return;
  if(k==="del"){entered.pop();}
  else if(entered.length<6){entered.push(k);}
  dotEls.forEach((d,i)=>d.classList.toggle("filled",i<entered.length));
  if(entered.length===6)setTimeout(()=>document.getElementById("lock").classList.add("unlocked"),250);
}

function iconHTML(a,kind,i){
  const bg=a.u?`background-image:url('${a.u}');background-size:cover`:`background:${a.c}`;
  return `<div class="app" onclick="openApp('${kind}',${i})"><div class="icon" style="${bg}">${a.u?"":a.e}</div>${kind==='g'?`<span>${a.n}</span>`:""}</div>`;

document.getElementById("dock").innerHTML=dock.map((a,i)=>iconHTML(a,'d',i)).join("");
function openApp(kind,i){
  const a=(kind==='g'?apps:dock)[i];
  const v=document.getElementById("appview");
  v.style.background=a.c;
  v.innerHTML=a.u?`<div class="big" style="width:100px;height:100px;border-radius:24px;background-image:url('${a.u}');background-size:cover"></div><h2>${a.n}</h2><p>敬请期待</p>`
              :`<div class="big">${a.e}</div><h2>${a.n}</h2><p>敬请期待</p>`;
  v.classList.remove("hidden");
}
function closeApp(){document.getElementById("appview").classList.add("hidden");}
