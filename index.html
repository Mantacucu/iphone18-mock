*{margin:0;box-sizing:border-box;font-family:-apple-system,sans-serif}
html,body{background:#111;height:100%}

.phone{width:430px;height:932px;background:#000;border-radius:60px;padding:12px;box-shadow:0 0 0 2px #333,0 30px 60px rgba(0,0,0,.6)}
.screen{width:100%;height:100%;border-radius:48px;overflow:hidden;position:relative;
  background:linear-gradient(160deg,#ff9a56,#ff6a88,#845ec2)}
@media (max-width:600px){
  body{min-height:100dvh}

}
.island{position:absolute;top:14px;left:50%;transform:translateX(-50%);width:120px;height:34px;background:#000;border-radius:20px;z-index:10}
.status{position:absolute;top:16px;left:32px;right:32px;display:flex;justify-content:space-between;color:#fff;font-size:15px;font-weight:600}
.grid{position:absolute;top:90px;left:0;right:0;padding:0 22px;display:grid;grid-template-columns:repeat(4,1fr);gap:22px 14px}
.app{display:flex;flex-direction:column;align-items:center;gap:6px}
.icon{width:58px;height:58px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:26px;box-shadow:0 3px 6px rgba(0,0,0,.25)}
.app span{color:#fff;font-size:11px;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.dock{position:absolute;bottom:20px;left:14px;right:14px;height:90px;background:rgba(255,255,255,.18);backdrop-filter:blur(20px);border-radius:32px;display:flex;justify-content:space-around;align-items:center}
.home{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:140px;height:5px;background:#fff;border-radius:3px;opacity:.9;cursor:pointer;z-index:20}
.appview{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:#fff;z-index:15;transition:transform .25s}
.appview.hidden{transform:translateY(100%)}
.appview .big{font-size:70px}
.appview h2{font-weight:600;font-size:20px}
.appview p{font-size:13px;opacity:.7}
.lock{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;color:#fff;overflow:hidden;transition:transform .5s ease,opacity .5s ease}
.lock.unlocked{transform:translateY(-100%);opacity:0;pointer-events:none}
.lockbg{position:absolute;inset:-20px;width:calc(100% + 40px);height:calc(100% + 40px);object-fit:cover;filter:blur(12px) brightness(.75);z-index:-1}
.locktime{font-size:76px;font-weight:600;margin-top:80px;text-shadow:0 2px 12px rgba(0,0,0,.3)}
.lockdate{font-size:16px;margin-top:2px;opacity:.9}
.dots{display:flex;gap:14px;margin-top:46px}
.dots span{width:12px;height:12px;border-radius:50%;border:1.5px solid #fff;background:transparent;transition:background .15s}
.dots span.filled{background:#fff}
.lockhint{font-size:13px;opacity:.75;margin-top:14px}
.keypad{margin-top:24px;display:grid;grid-template-columns:repeat(3,70px);gap:16px}
.key{width:70px;height:70px;border-radius:50%;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;font-size:27px}
.key.empty{background:transparent;font-size:12px;opacity:.8}
.wx{position:absolute;inset:0;background:#EDEDED;display:flex;flex-direction:column;color:#000;font-size:14px}
.wx-nav{height:44px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:#EDEDED;position:relative;font-weight:600;border-bottom:1px solid #d9d9d9}
.wx-back{position:absolute;left:12px;font-size:22px}
.wx-body{flex:1;overflow-y:auto}
.wx-item{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#fff;border-bottom:1px solid #f0f0f0}
.wx-avatar{width:44px;height:44px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.wx-item .name{font-size:15px;font-weight:500}
.wx-item .last{font-size:12px;color:#999;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px}
.wx-sec{padding:6px 14px;font-size:12px;color:#999;background:#EDEDED}
.wx-tabbar{height:60px;flex-shrink:0;display:flex;background:#F7F7F7;border-top:1px solid #d9d9d9}
.wx-tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:#888}
.wx-tab.active{color:#07C160}
.chat-msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;background:#EDEDED}
.msg-row{display:flex;gap:8px;max-width:100%}
.msg-row.me{flex-direction:row-reverse}
.msg-row .wx-avatar{flex-shrink:0;border-radius:6px}

.wx-input{height:50px;flex-shrink:0;background:#F7F7F7;border-top:1px solid #d9d9d9;display:flex;align-items:center;gap:10px;padding:0 12px}

.wx-send{color:#07C160;font-size:14px;font-weight:500;flex-shrink:0}
.wx-profile{padding:20px;background:#fff;display:flex;gap:14px;align-items:center}
.wx-cover{height:160px;position:relative}
.wx-cover .who{position:absolute;bottom:10px;right:14px;display:flex;align-items:center;gap:8px}

<script>
document.getElementById("dots").innerHTML=Array(6).fill('<span></span>').join("");
const dotEls=[...document.querySelectorAll("#dots span")];
let entered=[];
function keyHTML(k){
  if(k==="emg")return `<div class="key empty" onclick="keyTap('emg')">紧急<br>呼叫</div>`;
  if(k==="del")return `<div class="key empty" onclick="keyTap('del')">⌫</div>`;
  return `<div class="key" onclick="keyTap('${k}')">${k}</div>`;
}
document.getElementById("keypad").innerHTML=["1","2","3","4","5","6","7","8","9","emg","0","del"].map(keyHTML).join("");
function keyTap(k){
  if(k==="emg")return;
  if(k==="del"){entered.pop();}
  else if(entered.length<6){entered.push(k);}
  dotEls.forEach((d,i)=>d.classList.toggle("filled",i<entered.length));
  if(entered.length===6)setTimeout(()=>document.getElementById("lock").classList.add("unlocked"),250);
}

let wxTab="chat",wxChat=null;
function wxFindChat(id){return [...wxData.pinned,...wxData.others,...wxData.danger,...wxData.groups].find(c=>c.id===id);}
function wxAvatarHTML(c,size){
  size=size||44;
  if(c.noAvatar)return `<div class="wx-avatar" style="width:${size}px;height:${size}px;background:#ccc"></div>`;
  return `<div class="wx-avatar" style="width:${size}px;height:${size}px;background:${c.avatarBg}">${c.avatarE}</div>`;
}
function wxListHTML(){
  const row=(c)=>`<div class="wx-item" onclick="wxOpenChat('${c.id}')">${wxAvatarHTML(c)}<div><div class="name">${c.name}</div><div class="last">${c.msgs[c.msgs.length-1][1]}</div></div></div>`;
  return `<div class="wx-sec">置顶</div>${wxData.pinned.map(row).join("")}
  <div class="wx-sec">联系人</div>${[...wxData.others,...wxData.danger].map(row).join("")}
  <div class="wx-sec">群聊</div>${wxData.groups.map(row).join("")}`;
}
function wxChatHTML(c){
  const me={avatarBg:wxData.profile.avatarBg,avatarE:wxData.profile.avatarE};
  const bubbles=c.msgs.map(([s,t])=>`<div class="msg-row ${s}">${wxAvatarHTML(s==='me'?me:c,36)}<div class="bubble ${s}">${t}</div></div>`).join("");
  const notice=c.notice?`<div class="wx-note">群公告：${c.notice}</div>`:"";
  const note=c.note?`<div class="wx-note">${c.note}</div>`:"";
  return `<div class="wx-nav"><span class="wx-back" onclick="wxBack()">‹</span>${c.name}</div>
  <div class="chat-msgs" id="chatMsgs">${notice}${bubbles}${note}</div>
  <div class="wx-input"><input id="wxInputBox" placeholder="输入信息…" onkeydown="if(event.key==='Enter')wxSend()"><span class="wx-send" onclick="wxSend()">发送</span></div>`;
}
function wxPostHTML(m){
  const visible=m.visibleTo?`<div class="wx-visible">${m.visibleTo}</div>`:"";
  const likes=m.likes&&m.likes.length?`<div class="wx-likerow">❤ ${m.likes.join("，")}</div>`:"";
  const comments=(m.comments||[]).map(c=>`<div class="wx-comment">${c.replyTo?`<b>${c.who}</b> 回复 <b>${c.replyTo}</b>`:`<b>${c.who}</b>`}：${c.text}</div>`).join("");
  const social=(likes||comments)?`<div class="wx-social">${likes}${comments}</div>`:"";
  const note=m.note?`<div class="wx-note">${m.note}</div>`:"";
  return `<div class="wx-post">
    <div class="cap">${m.cap}</div>
    ${visible}
    ${m.img?`<div class="img">🖼️ ${m.imgCap}</div>`:""}
    <div class="wx-time">${m.date}</div>
    ${social}${note}
  </div>`;
}
function wxMomentsHTML(){
  return `<div class="wx-nav"><span class="wx-back" onclick="wxBack()">‹</span>朋友圈</div>
  <div class="wx-body">
  <div class="wx-cover" style="background:${wxData.profile.coverBg}">
    <div class="who">${wxAvatarHTML({avatarBg:wxData.profile.avatarBg,avatarE:wxData.profile.avatarE},40)}<span>${wxData.profile.name}</span></div>
  </div>
  <div class="wx-groupbox">朋友圈分组：${wxData.profile.groups.join(" / ")}</div>
  ${wxData.moments.filter(m=>!m.deleted).map(wxPostHTML).join("")}
  </div>`;
}
function wxProfileHTML(){
  return `<div class="wx-nav"><span class="wx-back" onclick="wxBack()">‹</span></div>
  <div class="wx-body">
  <div class="wx-profile-hd">
    <div class="wx-avatar" style="width:64px;height:64px;font-size:32px;background:${wxData.profile.avatarBg}">${wxData.profile.avatarE}</div>
    <div class="wx-profile-info">
      <div class="pname">${wxData.profile.name}</div>
      <div class="pmeta">微信号：${wxData.profile.wxid}</div>
      <div class="pmeta">地区：${wxData.profile.region}</div>
    </div>
  </div>
  <div class="wx-row" onclick="wxOpenMoments()"><span>朋友圈</span><div class="wx-cover-mini" style="background:${wxData.profile.coverBg}"></div></div>
  </div>`;
}
function wxMeHTML(){
  return `<div class="wx-nav">我</div>
  <div class="wx-body">
  <div class="wx-profile" onclick="wxOpenProfile()">
    <div class="wx-avatar" style="width:60px;height:60px;font-size:30px;background:${wxData.profile.avatarBg}">${wxData.profile.avatarE}</div>
    <div><div style="font-size:18px;font-weight:600">${wxData.profile.name}</div><div style="color:#999;font-size:13px;margin-top:4px">微信号：${wxData.profile.wxid}</div></div>
  </div>
  </div>`;
}
function wxTabbarHTML(){
  return `<div class="wx-tabbar">
    <div class="wx-tab ${wxTab==='chat'?'active':''}" onclick="wxSetTab('chat')">💬<span>微信</span></div>
    <div class="wx-tab" onclick="wxOpenMoments()">🔍<span>发现</span></div>
    <div class="wx-tab ${wxTab==='me'?'active':''}" onclick="wxSetTab('me')">🙂<span>我</span></div>
  </div>`;
}
function wxRender(){
  const v=document.getElementById("appview");
  let inner;
  if(wxChat==="moments")inner=wxMomentsHTML();
  else if(wxChat==="profile")inner=wxProfileHTML();
  else if(wxChat)inner=wxChatHTML(wxFindChat(wxChat));
  else if(wxTab==="me")inner=wxMeHTML();
  else inner=`<div class="wx-nav">微信</div><div class="wx-body">${wxListHTML()}</div>`;
  v.innerHTML=`<div class="wx">${inner}${wxChat?"":wxTabbarHTML()}</div>`;
  if(wxChat&&wxChat!=="moments"&&wxChat!=="profile"){
    const m=document.getElementById("chatMsgs");
    if(m)m.scrollTop=m.scrollHeight;
  }
}
function wxSend(){
  const inp=document.getElementById("wxInputBox");
  const t=inp.value.trim();
  if(!t)return;
  wxFindChat(wxChat).msgs.push(["me",t]);
  wxRender();
  document.getElementById("wxInputBox").focus();
}
function wxSetTab(t){wxTab=t;wxChat=null;wxRender();}
function wxOpenChat(id){wxChat=id;wxRender();}
function wxOpenProfile(){wxChat="profile";wxRender();}
function wxOpenMoments(){wxChat="moments";wxRender();}
function wxBack(){wxChat=null;wxRender();}
</script>
